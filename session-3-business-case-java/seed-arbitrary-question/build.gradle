apply plugin: 'application'

application {
    mainClass = 'io.honeycomb.masterclass.seedarbitraryquestion.SeedArbitraryQuestion'
}

dependencies {
    implementation platform("io.opentelemetry:opentelemetry-bom:${otelVersion}")
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation "io.opentelemetry.semconv:opentelemetry-semconv:${semconvVersion}"

    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    // Test only: a real gRPC server for the delivery test to receive spans on.
    // The JDK's HttpServer speaks HTTP/1.1 only and OTLP/gRPC needs HTTP/2, so
    // it cannot stand in for the Collector. See DeliveryTest.
    testImplementation "io.opentelemetry.proto:opentelemetry-proto:${otelProtoVersion}"
    testImplementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    testImplementation "io.grpc:grpc-stub:${grpcVersion}"
    testImplementation "io.grpc:grpc-protobuf:${grpcVersion}"
}

// The delivery test runs the seeder as a separate JVM, like a user would, and
// needs the seeder's runtime classpath to start it with. Passed as a system
// property named seeder.classpath.
def seederClasspath = sourceSets.main.runtimeClasspath

tasks.named('test') {
    inputs.files(seederClasspath)
    jvmArgumentProviders.add({ ["-Dseeder.classpath=${seederClasspath.asPath}"] } as CommandLineArgumentProvider)
}
