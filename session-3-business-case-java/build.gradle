allprojects {
    group = 'io.honeycomb.masterclass'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

// Settings shared by both programs. Unlike session 1, the OpenTelemetry
// dependencies are NOT declared here: business-case is a plain CLI that never
// touches OTel, so only seed-arbitrary-question asks for them.
subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.compilerArgs += ['-Xlint:unchecked', '-Werror']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
        testImplementation 'org.assertj:assertj-core:3.27.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
