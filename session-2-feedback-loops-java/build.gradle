allprojects {
    group = 'io.honeycomb.masterclass'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.compilerArgs += ['-Xlint:unchecked', '-Werror']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    // The OpenTelemetry SDK dependencies are declared in the seed-canary-regression
    // subproject, not here: the scenario library is plain Java and has no
    // OTel dependency, just as Go's internal/scenario imports no OTel package.
    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
        testImplementation 'org.assertj:assertj-core:3.27.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
